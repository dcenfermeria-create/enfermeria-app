<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visitas Domiciliarias</title>
<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1f2937,#111827);
    color:white;
    margin:0;
    padding:20px;
}
h1{ text-align:center; margin-bottom:20px; }
.card{
    background:#1f2937;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
input, select{
    padding:8px;
    border-radius:8px;
    border:none;
    margin:5px;
}
button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}
button:hover{ background:#2563eb; }
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    background:white;
    color:black;
    border-radius:10px;
    overflow:hidden;
}
th{
    background:#3b82f6;
    color:white;
    padding:10px;
}
td{
    padding:8px;
    border-bottom:1px solid #ddd;
}
.pagado{ background:#d1fae5 !important; }
.pendiente{ background:#fee2e2 !important; }
</style>
</head>
<body>

<h1>Visitas Domiciliarias</h1>

<div class="card">
<h2>Pacientes</h2>
<table>
<thead>
<tr>
<th>Documento</th>
<th>Nombre</th>
<th>Procedimiento</th>
<th>Valor</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tablaPacientes"></tbody>
</table>
</div>

<div class="card">
<h2>Agregar Paciente</h2>
<input type="text" id="doc" placeholder="Documento">
<input type="text" id="nombre" placeholder="Nombre completo">
<input type="text" id="procedimiento" placeholder="Procedimiento">
<input type="number" id="valor" placeholder="Valor">
<button onclick="agregarPaciente()">Agregar</button>
</div>

<script>
let pacientes=[];

function agregarPaciente(){
    let docVal = document.getElementById("doc").value;
    let nombreVal = document.getElementById("nombre").value;
    let procVal = document.getElementById("procedimiento").value;
    let valorVal = parseFloat(document.getElementById("valor").value);

    if(!docVal||!nombreVal||!valorVal) return alert("Documento, nombre y valor son obligatorios");

    pacientes.push({
        documento:docVal,
        nombre:nombreVal,
        procedimiento:procVal,
        valor:valorVal,
        estado:"Pendiente"
    });

    limpiar();
    render();
}

function limpiar(){
    doc.value=""; nombre.value=""; procedimiento.value=""; valor.value="";
}

function cambiarEstado(i){
    pacientes[i].estado = pacientes[i].estado==="Pendiente"?"Pagado":"Pendiente";
    render();
}

function render(){
    let tabla=document.getElementById("tablaPacientes");
    tabla.innerHTML="";
    pacientes.forEach((p,i)=>{
        tabla.innerHTML+=`
        <tr class="${p.estado==="Pagado"?"pagado":"pendiente"}">
            <td>${p.documento}</td>
            <td>${p.nombre}</td>
            <td>${p.procedimiento}</td>
            <td><input type="number" value="${p.valor}" onchange="pacientes[${i}].valor=parseFloat(this.value);render();"></td>
            <td>${p.estado}</td>
            <td><button onclick="cambiarEstado(${i})">Cambiar</button></td>
        </tr>`;
    });
}

render();
</script>

</body>
</html>
