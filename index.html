<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Facturación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body { font-family: Arial; margin: 20px; }
h2 { margin-top: 40px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
button { padding: 5px 10px; margin: 3px; }
input, select { padding: 4px; }
.dashboard { background: #f4f4f4; padding: 10px; margin-top: 10px; }
.pagado { background-color: #d4edda; }
.pendiente { background-color: #f8d7da; }
</style>
</head>
<body>

<h1>Sistema de Facturación</h1>

<label>Mes:
<input type="month" id="mesSelector">
</label>

<div class="dashboard">
<h3>Resumen General</h3>
<div id="totalGeneral"></div>
<div id="resumenEmpresas"></div>
</div>

<h2>Pacientes</h2>
<table>
<thead>
<tr>
<th>Documento</th>
<th>Nombre</th>
<th>Empresa</th>
<th>Valor</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tablaPacientes"></tbody>
</table>

<h2>Importar desde Excel</h2>
<select id="empresaImport">
<option value="Empresa A">Empresa A</option>
<option value="Empresa B">Empresa B</option>
<option value="Empresa C">Empresa C</option>
</select>
<input type="file" id="excelFile" accept=".xlsx,.xls">
<button onclick="importarExcel()">Importar Excel</button>

<h2>Agregar Paciente</h2>
<input type="text" id="doc" placeholder="Documento">
<input type="text" id="nombre" placeholder="Nombre">
<select id="empresa">
<option value="Empresa A">Empresa A</option>
<option value="Empresa B">Empresa B</option>
<option value="Empresa C">Empresa C</option>
</select>
<input type="number" id="valor" placeholder="Valor">
<button onclick="agregarPaciente()">Agregar</button>

<script>
let pacientes = [];

document.getElementById("mesSelector").value = new Date().toISOString().slice(0,7);

function agregarPaciente() {
    const mesActual = document.getElementById("mesSelector").value;
    const doc = document.getElementById("doc").value;
    const nombre = document.getElementById("nombre").value;
    const empresa = document.getElementById("empresa").value;
    const valor = parseFloat(document.getElementById("valor").value);

    if (!doc || !nombre || !valor) return alert("Complete todos los campos");

    if (pacientes.some(p => p.documento === doc && p.mes === mesActual)) {
        return alert("Este paciente ya existe en este mes");
    }

    pacientes.push({
        documento: doc,
        nombre: nombre,
        empresa: empresa,
        valor: valor,
        estado: "Pendiente",
        mes: mesActual
    });

    limpiarFormulario();
    render();
}

function limpiarFormulario() {
    document.getElementById("doc").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("valor").value = "";
}

function cambiarEstado(index) {
    pacientes[index].estado = pacientes[index].estado === "Pendiente" ? "Pagado" : "Pendiente";
    render();
}

function editarValor(index, nuevoValor) {
    pacientes[index].valor = parseFloat(nuevoValor);
    render();
}

function render() {
    const mesActual = document.getElementById("mesSelector").value;
    const tabla = document.getElementById("tablaPacientes");
    tabla.innerHTML = "";

    let totalGeneral = 0;
    let resumen = {};

    pacientes.filter(p => p.mes === mesActual).forEach((p, i) => {
        totalGeneral += p.valor;

        if (!resumen[p.empresa]) resumen[p.empresa] = 0;
        resumen[p.empresa] += p.valor;

        tabla.innerHTML += `
        <tr class="${p.estado === 'Pagado' ? 'pagado' : 'pendiente'}">
            <td>${p.documento}</td>
            <td>${p.nombre}</td>
            <td>${p.empresa}</td>
            <td><input type="number" value="${p.valor}" onchange="editarValor(${i}, this.value)"></td>
            <td>${p.estado}</td>
            <td><button onclick="cambiarEstado(${i})">Cambiar Estado</button></td>
        </tr>
        `;
    });

    document.getElementById("totalGeneral").innerHTML =
        "<strong>Total General: $" + totalGeneral.toLocaleString() + "</strong>";

    let resumenHTML = "<h4>Total por Empresa:</h4>";
    for (let emp in resumen) {
        resumenHTML += emp + ": $" + resumen[emp].toLocaleString() + "<br>";
    }
    document.getElementById("resumenEmpresas").innerHTML = resumenHTML;
}

function importarExcel() {
    const fileInput = document.getElementById("excelFile");
    const empresaSeleccionada = document.getElementById("empresaImport").value;
    const mesActual = document.getElementById("mesSelector").value;

    const file = fileInput.files[0];
    if (!file) return alert("Seleccione un archivo");

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        let importados = 0;

        json.forEach(row => {
            const doc = row.Documento || row.documento;
            const nombre = row.Nombre || row.nombre;
            const valor = parseFloat(row.Valor || row.valor);

            if (!doc || !nombre || !valor) return;

            if (!pacientes.some(p => p.documento === doc && p.mes === mesActual)) {
                pacientes.push({
                    documento: doc,
                    nombre: nombre,
                    empresa: empresaSeleccionada,
                    valor: valor,
                    estado: "Pendiente",
                    mes: mesActual
                });
                importados++;
            }
        });

        alert("Se importaron " + importados + " pacientes");
        render();
    };

    reader.readAsArrayBuffer(file);
}

document.getElementById("mesSelector").addEventListener("change", render);

render();
</script>

</body>
</html>
